name: Setup DigitalOcean K8s Cluster

on:
  workflow_dispatch:
    inputs:
      CLUSTER_NAME:
        description: 'Name of the Kubernetes cluster'
        type: string
        default: 'perfo-cluster'
        required: true
      NODE_SIZE:
        description: 'Size of the nodes'
        options:
          - s-2vcpu-2gb
          - s-4vcpu-8gb
          - s-8vcpu-16gb
          - s-16vcpu-32gb
        type: choice
        default: s-8vcpu-16gb
        required: true
      NODE_COUNT:
        description: 'Number of nodes'
        type: number
        default: 4
        required: true
      DURATION_TIME:
        description: 'How long to run before collecting metrics'
        type: number
        default: 10
        required: true
      # KUBERNETES_VERSION:
      #   description: 'Kubernetes version to use'
      #   type: string
      #   required: false
      # ACCOUNT_ID:
      #   description: 'Your account ID'
      #   type: string
      #   required: true
      # ACCESS_KEY:
      #   description: 'Your access key'
      #   type: string
      #   required: true
      STORAGE_VERSION:
        description: 'Storage version'
        type: string
        required: false
      NODE_AGENT_VERSION:
        description: 'Node agent version'
        type: string
        required: false
      ENABLE_KDR:
        description: 'Enable KDR'
        required: false
        type: boolean
        default: false
      PRIVATE_NODE_AGENT:
        description: 'Private node agent version'
        required: false
        type: string
      HELM_GIT_BRANCH:
        description: 'Helm chart branch (e.g., main)'
        required: false
        type: string
      

jobs:
  setup-cluster:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install kubectl
        run: |
          sudo snap install kubectl --classic
          kubectl version --client --output=yaml

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Create Kubernetes Cluster
        run: |
          CMD="doctl kubernetes cluster create ${{ github.event.inputs.CLUSTER_NAME }} \
            --region fra1 \
            --vpc-uuid 7ff72b70-98a3-4743-9e83-2f0131047d39 \
            --node-pool \"name=default-pool;size=${{ github.event.inputs.NODE_SIZE }};count=${{ github.event.inputs.NODE_COUNT }}\" \
            --tag \"helmTest\" \
            --wait"

          if [ ! -z "${{ github.event.inputs.KUBERNETES_VERSION }}" ]; then
            CMD="$CMD --version ${{ github.event.inputs.KUBERNETES_VERSION }}"
          fi

          echo "Running command: $CMD"
          eval $CMD

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save ${{ github.event.inputs.CLUSTER_NAME }}
          kubectl config set-context $(kubectl config current-context) --namespace=default

      - name: Connect to the cluster
        run: |
          CLUSTER_ID=$(doctl kubernetes cluster get ${{ github.event.inputs.CLUSTER_NAME }} --format ID --no-header)
          doctl kubernetes cluster kubeconfig save $CLUSTER_ID

      - name: Debug Inputs
        run: |
          echo "CLUSTER_NAME: ${{ github.event.inputs.CLUSTER_NAME }}"
          echo "NODE_SIZE: ${{ github.event.inputs.NODE_SIZE }}"
          echo "NODE_COUNT: ${{ github.event.inputs.NODE_COUNT }}"
          echo "DURATION_TIME: ${{ github.event.inputs.DURATION_TIME }}"
          # echo "KUBERNETES_VERSION: ${{ github.event.inputs.KUBERNETES_VERSION }}"
          echo "STORAGE_VERSION: ${{ github.event.inputs.STORAGE_VERSION }}"
          echo "NODE_AGENT_VERSION: ${{ github.event.inputs.NODE_AGENT_VERSION }}"
          echo "ENABLE_KDR: ${{ github.event.inputs.ENABLE_KDR }}"
          echo "PRIVATE_NODE_AGENT: ${{ github.event.inputs.PRIVATE_NODE_AGENT }}"
          echo "HELM_GIT_BRANCH: ${{ github.event.inputs.HELM_GIT_BRANCH }}"

      - name: Run Performance Test
        env:
          QUAYIO_REGISTRY_PASSWORD: ${{ secrets.QUAYIO_REGISTRY_PASSWORD }}
          QUAYIO_REGISTRY_USERNAME: ${{ secrets.QUAYIO_REGISTRY_USERNAME }}
          PERFO_GITHUB_TOKEN: ${{ secrets.PERFO_GITHUB_TOKEN }}
          ACCOUNT_ID: ${{ secrets.PERFO_ACCOUNT_ID }}
          ACCESS_KEY: ${{ secrets.PERFO_ACCESS_KEY }}
        run: |
          CMD="python performance.py -skip-cluster -nodes ${{ github.event.inputs.NODE_COUNT }} -node_size ${{ github.event.inputs.NODE_SIZE }} -account $ACCOUNT_ID -accessKey $ACCESS_KEY"

          if [ ! -z "${{ github.event.inputs.STORAGE_VERSION }}" ]; then
            CMD="$CMD -storage-version ${{ github.event.inputs.STORAGE_VERSION }}"
          fi
          
          if [ ! -z "${{ github.event.inputs.NODE_AGENT_VERSION }}" ]; then
            CMD="$CMD -node-agent-version ${{ github.event.inputs.NODE_AGENT_VERSION }}"
          fi
          
          if [ "${{ github.event.inputs.ENABLE_KDR }}" == "true" ]; then
            CMD="$CMD -kdr"
          fi
          
          if [ ! -z "${{ github.event.inputs.PRIVATE_NODE_AGENT }}" ]; then
            CMD="$CMD -private-node-agent ${{ github.event.inputs.PRIVATE_NODE_AGENT }}"
          fi

          if [ ! -z "${{ github.event.inputs.HELM_GIT_BRANCH }}" ]; then
            CMD="$CMD -helm-git-branch ${{ github.event.inputs.HELM_GIT_BRANCH }}"
          fi

          echo "Running command: $CMD"
          eval $CMD

      - name: Create RBAC
        run: |
              kubectl apply -f admin-role-binding.yaml

      - name: Create Git Auth Secret
        run: |
        
          # Create base64 encoded token
          echo -n "${{ secrets.PERFO_GITHUB_TOKEN }}" | base64 > token.b64
          
          # Create the secret
          kubectl create namespace default --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic git-auth \
            --namespace=default \
            --from-file=token=token.b64 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Webhook Secret
        run: |
          kubectl create secret generic perf-channel-webhook \
            --namespace=default \
            --from-literal=url=${{ secrets.PERFO_CHANNEL_WEBHOOK_URL }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy the Collect Metrics Job
        run: |         
          # Replace variables in the job yaml
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          cat collect-metrics-job.yaml | \
            sed "s/\$(DATE)/$TIMESTAMP/" | \
            sed "s/\$(DURATION_TIME)/${{ github.event.inputs.DURATION_TIME }}/" | \
            kubectl apply -f -
          
          echo "Metrics collection job deployed with duration: ${{ github.event.inputs.DURATION_TIME }} minutes"

      - name: Copy config.log to Kubernetes Pod
        run: |
          # Get the running pod for the job
          POD_NAME=$(kubectl get pod -l job-name=metrics-test -n default -o jsonpath="{.items[0].metadata.name}")

          if [ -z "$POD_NAME" ]; then
            echo "ERROR: No pod found for the 'metrics-test' job!"
            exit 1
          fi

          echo "Found pod: $POD_NAME"

          # Get the actual container name inside the pod
          CONTAINER_NAME=$(kubectl get pod $POD_NAME -n default -o jsonpath="{.spec.containers[0].name}")

          if [ -z "$CONTAINER_NAME" ]; then
            echo "ERROR: No container found in the pod!"
            exit 1
          fi

          echo "Found container: $CONTAINER_NAME"

          # Ensure the /workspace directory exists inside the container
          echo "Ensuring /workspace directory exists in the pod..."
          kubectl exec -n default $POD_NAME -c $CONTAINER_NAME -- mkdir -p /workspace

          # Copy config.log from GitHub Actions runner to the Kubernetes pod
          echo "Copying config.log to $POD_NAME:/workspace/config.log..."
          kubectl cp config.log default/$POD_NAME:/workspace/config.log -c $CONTAINER_NAME

          if [ $? -eq 0 ]; then
            echo "Successfully copied config.log to $POD_NAME:/workspace/config.log"
          else
            echo "ERROR: Failed to copy config.log!"
            exit 1
          fi
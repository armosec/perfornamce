name: Setup DigitalOcean K8s Cluster

on:
  workflow_dispatch:
    inputs:
      CLUSTER_NAME:
        description: 'Name of the Kubernetes cluster'
        type: string
        default: 'perfo-cluster'
        required: true
      NODE_SIZE:
        description: 'Size of the nodes'
        options:
          - s-2vcpu-2gb
          - s-4vcpu-8gb
          - s-8vcpu-16gb
          - c2-16vcpu-32gb-intel
          - c2-32vcpu-64gb-intel
          - c2-48vcpu-96gb-intel
        type: choice
        default: s-8vcpu-16gb
        required: true
      NODE_COUNT:
        description: 'Number of nodes'
        type: number
        default: 4
        required: true
      DURATION_TIME:
        description: 'How long to run before collecting metrics'
        type: number
        default: 10
        required: true
      LOAD_INTERVAL:
        description: 'Sleep duration in seconds before load generator starts'
        type: number
        default: 3600
        required: false
      # KUBERNETES_VERSION:
      #   description: 'Kubernetes version to use'
      #   type: string
      #   required: false
      # ACCOUNT_ID:
      #   description: 'Your account ID'
      #   type: string
      #   required: true
      # ACCESS_KEY:
      #   description: 'Your access key'
      #   type: string
      #   required: true
      # STORAGE_VERSION:
      #   description: 'Storage version'
      #   type: string
      #   required: false
      # NODE_AGENT_VERSION:
      #   description: 'Node agent version'
      #   type: string
      #   required: false
      ENABLE_KDR:
        description: 'Enable KDR'
        required: false
        type: boolean
        default: false
      PRIVATE_NODE_AGENT:
        description: 'Private node agent version'
        required: false
        type: string
      HELM_GIT_BRANCH:
        description: 'Helm chart branch (e.g., main)'
        required: false
        type: string
      ADDITIONAL_HELM_COMMAND:
        description: 'Additional Helm command for deployment'
        required: false
        type: string
      APPLICATION_MODE:
        description: 'Application mode'
        options:
          - microservices-demo
          - load-simulator
        type: choice
        default: microservices-demo
        required: true

jobs:
  setup-cluster:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install kubectl
        run: |
          sudo snap install kubectl --classic
          kubectl version --client --output=yaml

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Create Kubernetes Cluster
        run: |
          CMD="doctl kubernetes cluster create ${{ github.event.inputs.CLUSTER_NAME }} \
            --region fra1 \
            --vpc-uuid 7ff72b70-98a3-4743-9e83-2f0131047d39 \
            --node-pool \"name=default-pool;size=${{ github.event.inputs.NODE_SIZE }};count=${{ github.event.inputs.NODE_COUNT }}\" \
            --tag \"helmTest\" \
            --wait"

          if [ ! -z "${{ github.event.inputs.KUBERNETES_VERSION }}" ]; then
            CMD="$CMD --version ${{ github.event.inputs.KUBERNETES_VERSION }}"
          fi

          echo "Running command: $CMD"
          eval $CMD

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save ${{ github.event.inputs.CLUSTER_NAME }}
          kubectl config set-context $(kubectl config current-context) --namespace=default

      - name: Connect to the cluster
        run: |
          CLUSTER_ID=$(doctl kubernetes cluster get ${{ github.event.inputs.CLUSTER_NAME }} --format ID --no-header)
          doctl kubernetes cluster kubeconfig save $CLUSTER_ID

      - name: Debug Inputs
        run: |
          echo "CLUSTER_NAME: ${{ github.event.inputs.CLUSTER_NAME }}"
          echo "NODE_SIZE: ${{ github.event.inputs.NODE_SIZE }}"
          echo "NODE_COUNT: ${{ github.event.inputs.NODE_COUNT }}"
          echo "DURATION_TIME: ${{ github.event.inputs.DURATION_TIME }}"
          # echo "KUBERNETES_VERSION: ${{ github.event.inputs.KUBERNETES_VERSION }}"
          echo "STORAGE_VERSION: ${{ github.event.inputs.STORAGE_VERSION }}"
          echo "NODE_AGENT_VERSION: ${{ github.event.inputs.NODE_AGENT_VERSION }}"
          echo "ENABLE_KDR: ${{ github.event.inputs.ENABLE_KDR }}"
          echo "PRIVATE_NODE_AGENT: ${{ github.event.inputs.PRIVATE_NODE_AGENT }}"
          echo "HELM_GIT_BRANCH: ${{ github.event.inputs.HELM_GIT_BRANCH }}"

      - name: Run Performance Test
        env:
          QUAYIO_REGISTRY_PASSWORD: ${{ secrets.QUAYIO_REGISTRY_PASSWORD }}
          QUAYIO_REGISTRY_USERNAME: ${{ secrets.QUAYIO_REGISTRY_USERNAME }}
          PERFO_GITHUB_TOKEN: ${{ secrets.PERFO_GITHUB_TOKEN }}
          ACCOUNT_ID: ${{ secrets.PERFO_ACCOUNT_ID }}
          ACCESS_KEY: ${{ secrets.PERFO_ACCESS_KEY }}
        run: |
          CMD="python performance.py -skip-cluster -nodes ${{ github.event.inputs.NODE_COUNT }} -node_size ${{ github.event.inputs.NODE_SIZE }} -account $ACCOUNT_ID -accessKey $ACCESS_KEY"

          if [ ! -z "${{ github.event.inputs.STORAGE_VERSION }}" ]; then
            CMD="$CMD -storage-version ${{ github.event.inputs.STORAGE_VERSION }}"
          fi

          if [ ! -z "${{ github.event.inputs.NODE_AGENT_VERSION }}" ]; then
            CMD="$CMD -node-agent-version ${{ github.event.inputs.NODE_AGENT_VERSION }}"
          fi

          if [ "${{ github.event.inputs.ENABLE_KDR }}" == "true" ]; then
            CMD="$CMD -kdr"
          fi

          if [ ! -z "${{ github.event.inputs.PRIVATE_NODE_AGENT }}" ]; then
            CMD="$CMD -private-node-agent ${{ github.event.inputs.PRIVATE_NODE_AGENT }}"
          fi

          if [ ! -z "${{ github.event.inputs.HELM_GIT_BRANCH }}" ]; then
            CMD="$CMD -helm-git-branch ${{ github.event.inputs.HELM_GIT_BRANCH }}"
          fi

          if [ ! -z "${{ github.event.inputs.ADDITIONAL_HELM_COMMAND }}" ]; then
            CMD="$CMD -additional-helm-command \"${{ github.event.inputs.ADDITIONAL_HELM_COMMAND }}\""
          fi

          echo "Running command: $CMD"
          eval $CMD

      - name: Create RBAC
        run: |
              kubectl apply -f admin-role-binding.yaml

      - name: Create Git Auth Secret
        run: |

          # Create base64 encoded token
          echo -n "${{ secrets.PERFO_GITHUB_TOKEN }}" | base64 > token.b64

          # Create the secret
          kubectl create namespace default --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic git-auth \
            --namespace=default \
            --from-file=token=token.b64 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Webhook Secret
        run: |
          kubectl create secret generic perf-channel-webhook \
            --namespace=default \
            --from-literal=url=${{ secrets.PERFO_CHANNEL_WEBHOOK_URL }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy the Collect Metrics Job
        run: |
          # Replace variables in the job yaml
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          cat collect-metrics-job.yaml | \
            sed "s/\$(DATE)/$TIMESTAMP/" | \
            sed "s/\$(DURATION_TIME)/${{ github.event.inputs.DURATION_TIME }}/" | \
            kubectl apply -f -

          echo "Metrics collection job deployed with duration: ${{ github.event.inputs.DURATION_TIME }} minutes"

      - name: Deploy the Load Generator Job
        if: ${{ github.event.inputs.APPLICATION_MODE == 'microservices-demo' }}
        run: |
          # Apply the load-generator-job.yaml
          cat load-generator-job.yaml | \
            sed "s/\$(LOAD_INTERVAL)/${{ github.event.inputs.LOAD_INTERVAL }}/g" | \
            kubectl apply -f -

          echo "Load generator job deployed"

      - name: Wait for Pod and Copy config.log to Kubernetes Pod
        run: |
          echo "Waiting for metrics-test pod to be created..."
          POD_NAME=""
          RETRY_COUNT=0
          MAX_RETRIES=30

          while [ -z "$POD_NAME" ] && [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            POD_NAME=$(kubectl get pod -l job-name=metrics-test -n default -o jsonpath="{.items[0].metadata.name}" 2>/dev/null)
            if [ -z "$POD_NAME" ]; then
              echo "Attempt $RETRY_COUNT: Waiting for the 'metrics-test' pod to be created..."
              sleep 5
              RETRY_COUNT=$((RETRY_COUNT + 1))
            fi
          done

          if [ -z "$POD_NAME" ]; then
            echo "ERROR: Pod 'metrics-test' not found after max retries!"
            exit 1
          fi

          echo "Found pod: $POD_NAME"

          # Wait for the pod to be in Running state
          echo "Waiting for pod to reach Running state..."
          TIMEOUT=300
          ELAPSED=0
          while true; do
            POD_STATUS=$(kubectl get pod "$POD_NAME" -n default -o jsonpath="{.status.phase}")

            echo "Pod Status: $POD_STATUS"

            if [ "$POD_STATUS" == "Running" ]; then
              echo "Pod is ready for copying files."
              break
            fi

            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "ERROR: Timeout! Pod did not reach 'Running' state in time."
              kubectl describe pod "$POD_NAME" -n default
              exit 1
            fi

            echo "Waiting 5 seconds for pod to be ready..."
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          # Get the container name
          CONTAINER_NAME=$(kubectl get pod "$POD_NAME" -n default -o jsonpath="{.spec.containers[0].name}")
          echo "Using container: $CONTAINER_NAME"

          # Create the tmpWorkspace directory in the pod
          echo "Creating /tmpWorkspace directory in the pod..."
          kubectl exec -n default "$POD_NAME" -c "$CONTAINER_NAME" -- mkdir -p /tmpWorkspace

          # Copy config.log to the pod
          echo "Copying config.log to $POD_NAME:/tmpWorkspace/config.log"
          kubectl cp config.log default/$POD_NAME:/tmpWorkspace/config.log -c $CONTAINER_NAME
          echo "kubectl cp config.log debug/"

          # Check if the copy was successful
          if [ $? -eq 0 ]; then
            echo "Successfully copied config.log to pod"

            # Verify the file exists in the pod
            kubectl exec -n default "$POD_NAME" -c "$CONTAINER_NAME" -- ls -la /tmpWorkspace/config.log

            echo "Config.log successfully copied to pod. It will be included in the Git repository."
          else
            echo "WARNING: Failed to copy config.log to pod! The job will continue but may not include config data."
          fi

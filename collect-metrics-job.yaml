apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-collector
  namespace: default

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: run-script
  namespace: default
data:
  setup_and_run.sh: |
    #!/bin/bash
    set -e
    
    echo "Starting setup_and_run.sh script..."
    START_TIME=$(date +%s)

    echo "Updating package list and installing required packages..."
    apt-get update
    apt-get install -y git curl apt-transport-https ca-certificates

    echo "Downloading and installing kubectl..."
    curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    chmod +x kubectl
    mv kubectl /usr/local/bin/

    # Get Helm Chart Version
    HELM_VERSION=$(kubectl get deployment -n kubescape -o jsonpath='{.items[0].metadata.labels.helm\.sh/chart}')

    # Extract Image Versions (Excluding `http-request`)
    IMAGE_VERSIONS=$(kubectl get pods -n kubescape -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.spec.containers[*].image}{"\n"}{end}' |
        awk -F'/' '{print $NF}' | awk -F':' '{if ($2 ~ /^v/) print $1": "$2; else print $1": v"$2}' |
        grep -v "http-request" | sort -u)

    # Extract only one `node-agent` version (DaemonSet runs multiple instances)
    NODE_AGENT_VERSION=$(echo "$IMAGE_VERSIONS" | grep "node-agent" | head -n 1)

    WEBHOOK_URL=${{ secrets.PERFO_CHANNEL_WEBHOOK_URL }}

    # Send Slack notification (Job Started)
    # curl -X POST --data-urlencode "payload={\"channel\": \"C06AJ92GHLM\", \"username\": \"Performance-test\", \"icon_emoji\": \":rocket:\", \"text\": \"🚀 *Performance Test Started!* \nCluster: \`$CLUSTER_NAME\`\nHelm Chart: \`$HELM_VERSION\`\", \"attachments\": [{\"color\": \"#36a64f\", \"fields\": [{\"title\": \"Image Versions\", \"value\": \"\`\`\`$IMAGE_VERSIONS\`\`\`\", \"short\": false}], \"footer\": \"Kubernetes Cluster\", \"ts\": $(date +%s)}]}" $WEBHOOK_URL

    echo "Installing Python dependencies..."
    pip install --no-cache-dir requests pandas matplotlib plotly numpy

    echo "Decoding GIT_TOKEN..."
    DECODED_TOKEN=$(echo -n "${GIT_TOKEN}" | tr -d '\n' | base64 -d | tr -d '\n')

    echo "Cloning repository..."
    git clone "https://${DECODED_TOKEN}@github.com/armosec/perfornamce.git" /workspace
    cd /workspace

    echo "Configuring Git..."
    git config --global user.email "borisv@armosec.io"
    git config --global user.name "bvolovat"

    echo "Waiting for ${EXACT_DURATION} minutes before running tests..."
    #
    sleep $((EXACT_DURATION * 60))

    END_TIME=$(date +%s)
    EXACT_DURATION=$(( ($END_TIME - $START_TIME) / 60 ))
    export EXACT_DURATION

    echo "Creating output directory..."
    mkdir -p output

    echo "Running tests with exact duration of ${EXACT_DURATION} minutes..."
    python get_data_from_prometheus.py
    python get_pprof.py 

    echo "Pushing results to repository..."
    git add output/
    git commit -m "Add test results from cluster run - Duration: ${EXACT_DURATION}m"
    git push origin main

    echo "Test execution complete."

    # Send Slack notification (Job Finished)
    # curl -X POST --data-urlencode "payload={\"channel\": \"C06AJ92GHLM\", \"username\": \"Performance-test\", \"icon_emoji\": \":white_check_mark:\", \"text\": \"✅ *Performance Test Completed!* \nCluster: \`$CLUSTER_NAME\`\nHelm Chart: \`$HELM_VERSION\`\nDuration: *${EXACT_DURATION} minutes*\", \"attachments\": [{\"color\": \"#36a64f\", \"fields\": [{\"title\": \"Image Versions\", \"value\": \"\`\`\`$IMAGE_VERSIONS\`\`\`\", \"short\": false}], \"footer\": \"Kubernetes Cluster\", \"ts\": $(date +%s)}]}" $WEBHOOK_URL

    curl -X POST --data-urlencode "payload={
        \"channel\": \"C06AJ92GHLM\",
        \"username\": \"Performance-test\",
        \"icon_emoji\": \":military_helmet:\",
        \"text\": \"*Performance Test Completed!*\nHelm Chart: \`$HELM_VERSION\`\nDuration: *${EXACT_DURATION} minutes*\n<https://github.com/armosec/perfornamce/tree/main/output|View outputs>\",
        \"attachments\": [{
            \"color\": \"#007bff\",
            \"fields\": [{
                \"title\": \"Image Versions\",
                \"value\": \"\`\`\`$IMAGE_VERSIONS\`\`\`\",
                \"short\": false
            }]
        }]
    }" "$WEBHOOK_URL"

---

apiVersion: batch/v1
kind: Job
metadata:
  name: metrics-test
  namespace: default
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: metrics-collector
      containers:
      - name: metrics-collector
        image: python:3.9-slim
        command: ["/bin/bash", "/scripts/setup_and_run.sh"]
        env:
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: git-auth
              key: token
        - name: WEBHOOK_URL  
          valueFrom:
            secretKeyRef:
              name: perf-channel-webhook
              key: url
        volumeMounts:
        - name: run-script
          mountPath: /scripts
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"

      volumes:
      - name: run-script
        configMap:
          name: run-script
          defaultMode: 0777

      restartPolicy: Never

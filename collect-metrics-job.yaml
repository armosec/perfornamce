apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-collector
  namespace: default

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: run-script
  namespace: default
data:
  setup_and_run.sh: |
    #!/bin/bash
    set -e
    
    echo "Starting setup_and_run.sh script..."
    START_TIME=$(date +%s)

    # Decode the Git token
    DECODED_TOKEN=$(echo "${GIT_TOKEN}" | base64 -d)
    
    echo "Installing required packages..."
    apt-get update && apt-get install -y git curl apt-transport-https ca-certificates

    echo "Downloading and installing kubectl..."
    curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    chmod +x kubectl
    mv kubectl /usr/local/bin/

    echo "Installing Python dependencies..."
    pip install --no-cache-dir requests pandas matplotlib plotly numpy

    echo "Cloning performance repository for scripts..."
    git clone "https://${DECODED_TOKEN}@github.com/armosec/perfornamce.git" /workspace
    cd /workspace

    # Add these debug lines
    echo "Listing files in workspace directory:"
    ls -la /workspace/
    echo "Current working directory: $(pwd)"
    
    echo "Cloning Logs repository (shallow clone)..."
    git clone --depth 1 "https://${DECODED_TOKEN}@github.com/armosec/Logs.git" /workspace/Logs
    
    echo "Configuring Git..."
    git config --global user.email "borisv@armosec.io"
    git config --global user.name "bvolovat"
    
    # Setup environment variables for duration
    export EXACT_DURATION="${DURATION_TIME}"
    echo "Setting duration time: EXACT_DURATION=${EXACT_DURATION} minutes"

    echo "Waiting for ${EXACT_DURATION} minutes before collecting metrics..."
    sleep $((EXACT_DURATION * 60))

    # Get Helm version
    HELM_VERSION=$(kubectl get deployment -n kubescape -o jsonpath='{.items[0].metadata.labels.helm\.sh/chart}')
    CLEAN_HELM_VERSION=$(echo "$HELM_VERSION" | sed 's/[^a-zA-Z0-9._-]/_/g')

    # Extract Image Versions (Excluding `http-request`)
    IMAGE_VERSIONS=$(kubectl get pods -n kubescape -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.spec.containers[*].image}{"\n"}{end}' |
    awk -F'/' '{print $NF}' | awk -F':' '{if ($2 ~ /^v/) print $1": "$2; else print $1": v"$2}' |
    sort -u)
    
    # Set up the output directory path with timestamp and helm version
    TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
    export OUTPUT_DIR="/workspace/Logs/performance-inCluster/${TIMESTAMP}_helm_${CLEAN_HELM_VERSION}"
    echo "Setting OUTPUT_DIR environment variable: ${OUTPUT_DIR}"
    echo "Creating output directory: ${OUTPUT_DIR}"
    mkdir -p "${OUTPUT_DIR}"
    
    echo "Running tests with specified duration of ${DURATION_TIME} minutes..."
    python get_data_from_prometheus.py
    python get_pprof.py
    python threshold_check.py 
    python check_logs.py
    
    # Copy config.log to OUTPUT_DIR 
    if [ -f "/workspace/config.log" ]; then
      cp "/workspace/config.log" "${OUTPUT_DIR}/config.log"
      echo "Copied config.log from workspace root to OUTPUT_DIR"
    else
      echo "WARNING: config.log not found in workspace root"
    fi

    # Debug: Verify config.log is in the correct directory
    echo "Checking OUTPUT_DIR contents after copying config.log:"
    ls -l "${OUTPUT_DIR}"

    # Change to Logs repo directory to commit and push
    cd /workspace/Logs

    echo "Pushing results to Logs repository..."
    git add "performance-inCluster/${TIMESTAMP}_helm_${CLEAN_HELM_VERSION}"
    git commit -m "Add performance test results - Duration: ${DURATION_TIME}m, Helm: ${HELM_VERSION}"
    git push origin main

    LOG_URL="https://github.com/armosec/Logs/tree/main/performance-inCluster/${TIMESTAMP}_helm_${CLEAN_HELM_VERSION}"
    echo "Log URL: ${LOG_URL}"

    REPORT_FILE="${OUTPUT_DIR}/threshold_report.json"
    if [ -f "$REPORT_FILE" ]; then
        # Use Python to read and format the breach information
        BREACH_INFO=$(python3 - <<EOF
    import json
    with open('${REPORT_FILE}') as f:
        report = json.load(f)

    breaches = []
    if report['summary']['total_memory_violations'] > 0 or report['summary']['total_cpu_violations'] > 0:
        breaches.append("*⚠️ Threshold Breaches Detected:*")
        
        # Format Memory violations
        for violation in report['violations']['Memory']:
            pod = violation['pod']
            max_value = violation['max_value']
            duration = violation['duration_seconds']
            breaches.append(f"• Memory breach in pod `{pod}`:")
            breaches.append(f"  - Peak: {max_value} MiB")
            breaches.append(f"  - Duration: {duration}s")
        
        # Format CPU violations
        for violation in report['violations']['CPU']:
            pod = violation['pod']
            max_value = violation['max_value']
            duration = violation['duration_seconds']
            breaches.append(f"• CPU breach in pod `{pod}`:")
            breaches.append(f"  - Peak: {max_value} cores")
            breaches.append(f"  - Duration: {duration}s")

    print('\n'.join(breaches) if breaches else '')
    EOF
    )
    fi

    # Prepare the Slack message with breach information
    if [ -n "$BREACH_INFO" ]; then
        BREACH_ATTACHMENT=', {
            "color": "#FF0000",
            "text": "'"${BREACH_INFO}"'"
        }'
    else
            BREACH_INFO="No memory or CPU breaches detected."
    BREACH_ATTACHMENT=', {
        "color": "#00FF00",
        "text": "'"${BREACH_INFO}"'"
    }'
    fi

    curl -X POST --data-urlencode "payload={
        \"channel\": \"C06AJ92GHLM\",
        \"username\": \"Performance-test\",
        \"icon_emoji\": \":military_helmet:\",
        \"text\": \"*Performance Test Completed!*\nHelm Chart: \`$HELM_VERSION\`\nDuration: *${EXACT_DURATION} minutes*\n<${LOG_URL}|View outputs>\n\n⚠️ *IMPORTANT REMINDER:*\nPlease don't forget to scale down the cluster in the url: <https://cloud.digitalocean.com/kubernetes/clusters?i=17a137|Kubernetes Clusters>\",
        \"attachments\": [{
            \"color\": \"#007bff\",
            \"fields\": [{
                \"title\": \"Image Versions\",
                \"value\": \"\`\`\`$IMAGE_VERSIONS\`\`\`\",
                \"short\": false
            }]
        }${BREACH_ATTACHMENT}]
    }" "$WEBHOOK_URL"

---

apiVersion: batch/v1
kind: Job
metadata:
  name: metrics-test
  namespace: default
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: metrics-collector
      containers:
      - name: metrics-collector
        image: python:3.9-slim
        command: ["/bin/bash", "/scripts/setup_and_run.sh"]
        env:
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: git-auth
              key: token
        - name: WEBHOOK_URL  
          valueFrom:
            secretKeyRef:
              name: perf-channel-webhook
              key: url
        - name: DURATION_TIME
          value: "$(DURATION_TIME)"
        volumeMounts:
        - name: run-script
          mountPath: /scripts
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"

      volumes:
      - name: run-script
        configMap:
          name: run-script
          defaultMode: 0777

      restartPolicy: Never